name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: make app
      - name: Zip app
        run: ditto -c -k --keepParent build/ScreenRecord.app build/ScreenRecord.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenRecord
          path: build/ScreenRecord.zip
